# One check: the test suite, on every pull request.
#
# The repository ruleset (SETUP.md) requires a pull request and this `gate`
# check. The pull request supplies this file and the tests it runs, so a pull
# request can change its own check: read the diff before merging.
# Actions are pinned by commit sha.

name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Run the tests
        run: python scripts/run_tests.py
