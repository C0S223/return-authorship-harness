# Project defaults; the operator must verify effective settings after trust.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_fallback_filenames = ["CLAUDE.md"]

[sandbox_workspace_write]
network_access = false

[features]
# This kit ships no Codex hooks. The two unified_exec values below are kept from an
# earlier version and are not tested here.
hooks = false
unified_exec = false
unified_exec_tty = false
